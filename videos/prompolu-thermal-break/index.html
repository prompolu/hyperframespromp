  <script>
    const tl = gsap.timeline({ paused: true });
    // Restrained adaptation of the official caption-clip-wipe recipe.
    tl.fromTo("#eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power1.out" }, 0.10);
    tl.fromTo(".title-line", { clipPath: "inset(0 100% 0 0)", y: 12 }, { clipPath: "inset(0 0% 0 0)", y: 0, duration: 0.58, stagger: 0.10, ease: "expo.out" }, 0.14);
    tl.fromTo("#subtitle", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "sine.out" }, 0.69);
    // The schematic appears before the two material bodies separate.
    tl.fromTo("#technical-hero", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.62, ease: "power4.out" }, 0.80);
    tl.fromTo("#aluminium-left", { x: 40 }, { x: -60, duration: 1.00, ease: "power3.inOut" }, 1.55);
    tl.fromTo("#aluminium-right", { x: -40 }, { x: 60, duration: 1.00, ease: "power3.inOut" }, 1.55);
    // Polyamide connects the two final inside edges (350 and 570).
    tl.fromTo("#polyamide-top", { scaleX: 0, opacity: 0, transformOrigin: "50% 50%" }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 2.45);
    tl.fromTo("#polyamide-bottom", { scaleX: 0, opacity: 0, transformOrigin: "50% 50%" }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "circ.out" }, 2.54);
    tl.fromTo("#polyamide-callout", { opacity: 0 }, { opacity: 1, duration: 0.23, ease: "none" }, 2.98);
    tl.fromTo("#polyamide-label", { opacity: 0 }, { opacity: 1, duration: 0.28, ease: "power2.out" }, 3.03);
    tl.fromTo("#technical-resolve", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "sine.out" }, 3.10);
    // The resolved composition holds to the fixed five-second endpoint.
    window.__timelines["prompolu-thermal-break"] = tl;
    tl.seek(0);
