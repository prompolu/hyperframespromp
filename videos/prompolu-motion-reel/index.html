<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PROMPOLU — Motion reel</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;600&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* PROMPOLU palette (prompolu.com) — no other colours are used. */
:root {
  --bronze: #765333; --cream: #F1F0EC; --ink: #17120D;
  --b-deep: #4E3520; --b-2: #6A4A2D; --b-3: #8A6845; --b-mid: #A8784A; --b-warm: #C08F57; --b-light: #D9A86C; --b-hi: #EBCB97;
  --g-1: #C9C3BA; --g-2: #A39B92; --g-3: #8F877E; --g-4: #7A7168; --g-5: #5E574F; --g-6: #4F4740; --g-7: #3A332C; --paper: #F8F7F4;
  --polished: radial-gradient(circle at 30% 25%, #EBCB97 0%, #D9A86C 30%, #A8784A 65%, #765333 100%);
}
html, body { margin: 0; background: #17120D; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--g-6); transform-origin: 0 0; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.abs { position: absolute; left: 0; top: 0; }
svg.full { overflow: visible; }

/* Backgrounds */
#bgEditor { background-color: var(--g-7); background-image: radial-gradient(circle at 16px 16px, rgba(241,240,236,.10) 0 1px, rgba(241,240,236,0) 1.6px); background-size: 32px 32px; }
#bgMorph { opacity: 0; background: linear-gradient(90deg, #7A7168, #5E574F); }
#bgMorph .lower { background: linear-gradient(90deg, #17120D, #3A332C); -webkit-mask-image: linear-gradient(180deg, transparent, #000); mask-image: linear-gradient(180deg, transparent, #000); }
#bgMorph .glow { background: radial-gradient(circle 900px at 100% 100%, #D9A86C 0%, #A8784A 42%, rgba(168,120,74,0) 100%); opacity: .7; }
#bgCream { opacity: 0; background: var(--cream); }
#creamGlow { opacity: 0; background: radial-gradient(ellipse 900px 420px at 960px 540px, #F8F7F4 0%, rgba(248,247,244,0) 100%); }

/* Editor window (final-layout coordinates; the dolly-out scales it into view) */
#winGroup { transform-origin: 960px 424px; }
#win { position: absolute; left: 345px; top: 56px; width: 1228px; height: 1060px; background: var(--ink); border: 1px solid rgba(241,240,236,.10); border-radius: 14px; }
#topbar { position: absolute; left: 345px; top: 56px; width: 1230px; height: 44px; font: 400 17px/44px 'JetBrains Mono', monospace; color: var(--g-3); white-space: pre; }
#topbar .l { position: absolute; left: 22px; } #topbar .r { position: absolute; right: 22px; }
#topbar .dot { color: var(--b-light); } #topbar .file { color: rgba(241,240,236,.85); } #topbar .fps { color: var(--cream); font-weight: 600; }
#graph { position: absolute; left: 345px; top: 760px; width: 1230px; height: 340px; background: var(--ink); border-top: 1px solid rgba(241,240,236,.10); border-radius: 0 0 14px 14px; }
#graph .row { position: absolute; left: 27px; font: 400 17px/1 'JetBrains Mono', monospace; color: var(--g-3); white-space: pre; }
#graph .row.on { color: var(--cream); } #graph .val { color: var(--b-light); }
#graphSvg { position: absolute; left: 335px; top: 12px; width: 870px; height: 300px; overflow: visible; }
#glabel { font: 400 15px 'JetBrains Mono', monospace; }

/* Scene (the dark studio; becomes the editor viewport) */
#scene { transform-origin: 0 0; overflow: hidden; }
#sceneBg { background: linear-gradient(180deg, #7A7168 0%, #4F4740 50%, #17120D 100%); }
#floorGlow { opacity: 0; background: radial-gradient(ellipse 575px 210px at 960px 1209.6px, #D9A86C 0%, #A8784A 45%, rgba(168,120,74,0) 100%); }
#flatCover { background: var(--g-6); }
.speck { position: absolute; border-radius: 50%; background: rgba(241,240,236,.6); }
#pushCam, #letterPunch, #outlinePunch { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
#word { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1400px; }
.L { position: absolute; top: 0; white-space: pre; font-weight: 800; font-family: 'Archivo', sans-serif; font-stretch: 125%; line-height: 1; opacity: 0; }
.L .face { position: absolute; left: 0; top: 0; color: transparent; -webkit-background-clip: text; background-clip: text; }
.L .alu { background-image: linear-gradient(180deg, #F1F0EC var(--capTop), #C9C3BA var(--base)); }
.L .bronzeFace { opacity: 0; }
#outlines text { font-family: 'Archivo', sans-serif; font-weight: 800; font-stretch: 125%; fill: none; stroke: rgba(241,240,236,.35); stroke-width: 2; vector-effect: non-scaling-stroke; }
.ember { position: absolute; width: 2px; height: 12px; border-radius: 1px; background: linear-gradient(180deg, #F1F0EC, #D9A86C); opacity: 0; }
#floorLine { position: absolute; left: 240px; top: 820px; width: 1385px; height: 2px; background: rgba(241,240,236,.8); transform: scaleX(0); transform-origin: 692.5px 1px; }
#shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(23,18,13,.45), rgba(23,18,13,0)); opacity: 0; }
#ball { position: absolute; opacity: 0; filter: url(#puffy); }
#ballFill { position: absolute; inset: 0; border-radius: 50%; background: var(--polished); }
#ballSpec, .spec { position: absolute; left: 21%; top: 15%; width: 22%; height: 15%; border-radius: 50%; background: radial-gradient(closest-side, #fff 55%, rgba(255,255,255,0) 100%); transform: rotate(-28deg); }
#caption { position: absolute; left: 0; top: 907px; width: 1920px; height: 0; }
#caption .line { position: absolute; left: 0; width: 1920px; top: -35px; text-align: center; font: 600 58px/70px 'Inter', sans-serif; letter-spacing: -0.01em; white-space: pre; }
#caption span { display: inline-block; opacity: 0; }
#capEasing { font-weight: 700 !important; color: var(--b-light); }

/* Fly-through, toggle, glass disc */
#fly { position: absolute; opacity: 0; filter: url(#puffy); }
#flyFill { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 110% at 30% 25%, #EBCB97 0%, #D9A86C 30%, #A8784A 65%, #765333 100%); }
#track { position: absolute; left: 705px; top: 426px; width: 510px; height: 250px; border-radius: 125px; opacity: 0;
  background: rgba(241,240,236,.22); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: inset 0 1.5px 0 rgba(241,240,236,.5), 0 18px 40px rgba(23,18,13,.35); }
#fillWrap { position: absolute; left: 705px; top: 426px; width: 510px; height: 250px; filter: url(#puffy); }
#fill { position: absolute; inset: 0; border-radius: 125px; background: linear-gradient(90deg, #C08F57 0%, #A8784A 50%, #765333 100%); clip-path: inset(0 100% 0 0 round 125px); }
#fill::after { content: ''; position: absolute; inset: 0; border-radius: 125px; background: linear-gradient(180deg, rgba(235,203,151,.6) 0%, rgba(235,203,151,0) 38%); }
#knob { position: absolute; width: 210px; height: 210px; left: -105px; top: -105px; border-radius: 50%; opacity: 0; filter: url(#puffy);
  background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #F1F0EC 42%, #C9C3BA 100%); }
#sphere { position: absolute; left: 835px; top: 426px; width: 250px; height: 250px; border-radius: 50%; opacity: 0; background: var(--polished); filter: url(#puffy); }
#bubble { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%; opacity: 0; box-sizing: border-box;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.55) 0%, rgba(241,240,236,.30) 22%, rgba(241,240,236,.18) 70%, rgba(241,240,236,.34) 100%);
  border: 1.5px solid rgba(241,240,236,.5); box-shadow: 0 18px 40px rgba(23,18,13,.30); }
#disc { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; overflow: visible; opacity: 0; }
#morphCap { position: absolute; left: 0; top: 896px; width: 1920px; height: 0; }
#morphCap div { position: absolute; left: 0; top: -62px; width: 1920px; text-align: center; font: 600 104px/124px 'Inter', sans-serif; letter-spacing: -0.02em; color: var(--b-light); opacity: 0; }
#flood { opacity: 0; background: radial-gradient(circle at 960px 540px, #8A6845 0%, #765333 55%, #6A4A2D 100%); }
#floodSolid { background: var(--bronze); }

/* Bento */
#bento { perspective: 1600px; perspective-origin: 960px 540px; opacity: 0; }
#bentoCam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.tile { position: absolute; width: 520px; height: 330px; border-radius: 24px; background: var(--paper); overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 12px 30px rgba(23,18,13,.06); }
.tile .idx, #t2 .idx { position: absolute; left: 28px; top: 24px; font: 400 18px/1 'JetBrains Mono', monospace; color: var(--g-2); }
.tile .lab, #t2 .lab { position: absolute; left: 28px; top: 50px; font: 600 26px/1.2 'Inter', sans-serif; letter-spacing: -0.01em; color: var(--ink); }
#t2wrap { position: absolute; left: 700px; top: 185px; width: 520px; height: 330px; border-radius: 24px; box-shadow: 0 18px 40px rgba(118,83,51,.30); }
#t2 { position: absolute; inset: 0; border-radius: 24px; background: var(--bronze); filter: url(#puffy); overflow: hidden; }
#t2 .idx, #t2 .lab { color: #FFFFFF; } #t2 .idx { opacity: .7; }
.sdot { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #FFFFFF 55%, #F1F0EC 100%); }
.typeW { position: absolute; left: 0; top: 112px; width: 520px; text-align: center; font: 800 180px/180px 'Inter', sans-serif; letter-spacing: -0.02em; color: var(--ink); }
#typePuffy { filter: url(#puffy); }
.cubeWrap { position: absolute; left: 230px; top: 68px; width: 220px; height: 220px; perspective: 1400px; }
.cube { position: absolute; inset: 0; transform-style: preserve-3d; }
.face3 { position: absolute; width: 220px; height: 220px; box-sizing: border-box; border: 2px solid var(--ink); background: #FFFFFF; }
.face3.alt { background: var(--paper); }
.face3.top { background: linear-gradient(135deg, #A8784A 0%, #765333 100%); }
.face3.top::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(235,203,151,.55) 0%, rgba(235,203,151,0) 45%); }
.stripes { position: absolute; left: 40px; top: 118px; width: 440px; height: 150px; border-radius: 10px; background: repeating-linear-gradient(45deg, #17120D 0 22px, #A8784A 22px 44px); }
#glassCap { position: absolute; left: 150px; top: 138px; width: 220px; height: 110px; border-radius: 55px; background: rgba(255,255,255,.22);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 10px 24px rgba(23,18,13,.18); }
#bars { position: absolute; left: 49px; top: 0; width: 422px; height: 330px; filter: url(#puffy); }
.bar { position: absolute; bottom: 36px; width: 26px; border-radius: 13px; background: var(--ink); transform-origin: 50% 100%; }
.bar.bz { background: var(--bronze); }
#pathSvg { position: absolute; left: 0; top: 0; width: 520px; height: 330px; overflow: visible; }

/* Counter */
#counterCam { transform-origin: 960px 540px; opacity: 0; }
#card { position: absolute; left: 370px; top: 325px; width: 1180px; height: 430px; border-radius: 32px; background: var(--paper); box-shadow: 0 30px 80px rgba(23,18,13,.08); }
.reel { position: absolute; top: 390px; height: 300px; overflow: hidden; filter: url(#puffy); }
.strip { position: absolute; left: 0; top: 0; width: 100%; font: 800 300px/300px 'Inter', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: center; color: var(--ink); }
.strip.bz { color: var(--bronze); }
.strip div { height: 300px; }
#cdot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--bronze); transform: scale(0); }
#framesW { position: absolute; left: 1098px; top: 466px; font: 700 80px/1 'Inter', sans-serif; letter-spacing: -0.02em; color: var(--ink); opacity: 0; white-space: pre; }
#oneHtml { position: absolute; left: 1101px; top: 566px; font: 400 50px/1 'Inter', sans-serif; letter-spacing: -0.01em; color: var(--g-3); white-space: pre; }

/* Logo reveal */
#spark { position: absolute; width: 10px; height: 10px; left: -5px; top: -5px; border-radius: 50%; background: #A8784A; box-shadow: 0 0 10px 3px rgba(168,120,74,.45); opacity: 0; }
#cursor { position: absolute; left: 0; top: 0; width: 36px; height: 36px; opacity: 0; transform-origin: 0 0; filter: drop-shadow(0 3px 5px rgba(23,18,13,.35)); }

/* Global overlays (never over the logo layer) */
#grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
#vig { background: radial-gradient(ellipse farthest-corner at 50% 50%, rgba(23,18,13,0) 60%, rgba(23,18,13,1) 100%); opacity: .18; }
#endVig { opacity: 0; background: radial-gradient(ellipse 750px 300px at 960px 540px,
  rgba(23,18,13,0) 100%, rgba(23,18,13,.06) 117%, rgba(23,18,13,.2) 134%, rgba(23,18,13,.42) 151%, rgba(23,18,13,.66) 168%, rgba(23,18,13,.86) 184%, rgba(23,18,13,1) 200%); }
.win { position: absolute; overflow: hidden; opacity: 0; }
.win img { position: absolute; display: block; width: 1204px; height: 166px; }
#logoFinal { position: absolute; left: 358px; top: 457px; width: 1204px; height: 166px; display: block; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- PUFFY MATERIAL: shared by every heavy glyph, the ball, the toggle, the cards and the digits. Never the logo. -->
      <filter id="puffy" x="-30%" y="-30%" width="160%" height="175%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="7" specularConstant=".9" specularExponent="22" lighting-color="#FFFFFF" result="spec">
          <fePointLight x="-400" y="-600" z="500"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0" result="lit"/>
        <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#17120D" flood-opacity=".25"/>
      </filter>
      <!-- The same chain plus a second specular pass lit from below in #D9A86C at 50 %: the bronze rim of "MOTION". -->
      <filter id="puffyAlu" x="-30%" y="-30%" width="160%" height="175%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
        <feSpecularLighting in="blur" surfaceScale="7" specularConstant=".9" specularExponent="22" lighting-color="#FFFFFF" result="spec">
          <fePointLight x="-400" y="-600" z="500"/>
        </feSpecularLighting>
        <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
        <feSpecularLighting in="blur" surfaceScale="7" specularConstant=".9" specularExponent="14" lighting-color="#D9A86C" result="rim">
          <fePointLight x="160" y="900" z="140"/>
        </feSpecularLighting>
        <feComposite in="rim" in2="SourceAlpha" operator="in" result="rimIn"/>
        <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0" result="lit"/>
        <feComposite in="lit" in2="rimIn" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0" result="lit2"/>
        <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#17120D" flood-opacity=".25"/>
      </filter>
      <!-- Directional motion-blur filters, one per moving element (stdDeviation set every frame). -->
      <filter id="mbL0" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbL1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbL2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbL3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbL4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbL5" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbR0" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbR1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbR2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="curveSmear" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="0"/></filter>
      <!-- Velocity blur that fills the gaps between the 4 averaged sub-frames (σ ≈ 0.45 × displacement per sub-frame). -->
      <filter id="mbBall" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbKnob" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbCur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="0"/></filter>
      <filter id="mbCam" x="-24" y="-24" width="1968" height="1128" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="0" edgeMode="duplicate"/></filter>
    </defs>
  </svg>

  <div id="bgEditor" class="full"></div>
  <div id="bgMorph" class="full"><div class="lower full"></div><div class="glow full"></div></div>
  <div id="bgCream" class="full"><div id="creamGlow" class="full"></div></div>

  <div id="editorAll" class="full">
    <div id="winGroup" class="full">
      <div id="win"></div>
      <div id="topbar"><span class="l"><span class="dot">●</span> <span class="file">easing.html</span> · Viewport · Graph</span><span class="r"><span id="tread">t 0.000 s · frame 0 / 600</span>   <span class="fps">60 fps</span></span></div>
      <div id="graph">
        <div class="row on" style="top:30px">● Position X   <span class="val" id="posx">1450.0</span></div>
        <div class="row" style="top:74px">○ Position Y</div>
        <div class="row" style="top:118px">○ Scale</div>
        <div class="row" style="top:162px">○ Rotation</div>
        <svg id="graphSvg" viewBox="0 0 870 300">
          <g id="ggrid" stroke="rgba(241,240,236,.05)" stroke-width="1"></g>
          <line id="stem" stroke="#F1F0EC" stroke-width="1.5" stroke-opacity=".75"/>
          <path id="curve" fill="none" stroke="#F1F0EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#curveSmear)"/>
          <rect id="dStart" width="12" height="12" fill="#D9A86C"/>
          <rect id="dEnd" width="12" height="12" fill="#F1F0EC"/>
          <circle id="handle" r="6" fill="none" stroke="#F1F0EC" stroke-width="1.5"/>
          <g id="playhead"><rect x="-4" y="0" width="10" height="300" fill="#D9A86C" opacity=".14"/><rect x="-1" y="0" width="2" height="300" fill="#D9A86C"/></g>
          <text id="glabel" x="860" y="292" text-anchor="end" fill="#C9C3BA">linear</text>
        </svg>
      </div>
    </div>
    <div id="scene" class="full">
      <div id="sceneBg" class="full"></div>
      <div id="floorGlow" class="full"></div>
      <div id="dust" class="full"></div>
      <div id="pushCam">
        <div id="outlinePunch"><svg id="outlines" class="full" viewBox="0 0 1920 1080"></svg></div>
        <div id="letterPunch"><div id="word"></div><div id="embers" class="full"></div></div>
      </div>
      <div id="floorLine"></div>
      <svg id="trails" class="full" viewBox="0 0 1920 1080"><g id="arcDots"></g><g id="flatDots"></g><g id="marks"></g></svg>
      <div id="shadow"></div>
      <div id="ball"><div id="ballFill"></div><div id="ballSpec"></div></div>
      <div id="caption">
        <div class="line" id="capSquash"><span id="cw1" style="color:#F1F0EC">Squash</span><span id="cw2" style="color:#F1F0EC"> &amp;</span><span id="cw3" style="color:#D9A86C"> stretch.</span></div>
        <div class="line"><span id="capEasing">Easing.</span></div>
      </div>
      <div id="flatCover" class="full"></div>
    </div>
  </div>

  <div id="flyLayer" class="full">
    <div id="track"></div>
    <div id="fillWrap"><div id="fill"></div></div>
    <div id="fly"><div id="flyFill"></div><div class="spec"></div></div>
    <div id="sphere"><div class="spec"></div></div>
    <div id="knob"></div>
    <div id="discGroup" class="abs">
      <div id="bubble"></div>
      <svg id="disc" viewBox="-170 -170 340 340"><g id="wedges"></g><circle r="168.5" fill="none" stroke="#A8784A" stroke-width="3"/><circle id="cdotDisc" r="11" fill="#D9A86C"/></svg>
    </div>
    <div id="morphCap"><div id="morphWord">Morph.</div></div>
  </div>

  <div id="flood" class="full"><div id="floodSolid" class="full"></div></div>

  <div id="bento" class="full">
    <div id="bentoCam">
      <div id="floodCard" class="abs" style="z-index:5;background: radial-gradient(circle at 50% 50%, #8A6845 0%, #765333 55%, #6A4A2D 100%)"><div id="floodCardSolid" class="abs" style="inset:0;width:auto;height:auto;background:#765333;opacity:0"></div></div>
      <div class="tile" id="t1" style="left:130px;top:185px">
        <div class="idx">01</div><div class="lab">Kinetic type</div>
        <div class="typeW" id="typePlain">Type</div><div class="typeW" id="typePuffy">Type</div>
      </div>
      <div id="t2wrap"><div id="t2">
        <div class="idx">02</div><div class="lab">Springs</div>
        <div class="sdot" style="left:150px"></div><div class="sdot" style="left:238.4px"></div><div class="sdot" style="left:326.8px"></div>
      </div></div>
      <div class="tile" id="t3" style="left:1270px;top:185px">
        <div class="idx">03</div><div class="lab">3D</div>
        <div class="cubeWrap"><div class="cube" id="cube">

    const dg = $('#discGroup'), bub = $('#bubble'), disc = $('#disc');
    show(dg, t >= 4.75 && t < 5.0);
    css(dg, { transform: `translate(${px(gx)}, 551px)` });
    css(bub, { opacity: (kb * (1 - seg(t, 4.84, 4.88))).toFixed(3), transform: `scale(${lerp(250 / 340, 1, kb).toFixed(4)})` });
    disc.style.opacity = (seg(t, 4.82, 4.86) * (1 - seg(t, 4.985, 5.0))).toFixed(3);
    disc.style.transform = `rotate(${(20 * kd).toFixed(3)}deg)`;
    const gap = 7 * seg(t, 4.82, 4.90, E.out3);
    for (const w of EL.wedges) w.g.setAttribute('transform', `translate(${(gap * Math.cos(w.a)).toFixed(2)} ${(gap * Math.sin(w.a)).toFixed(2)})`);
    const burst = seg(t, 4.95, 4.99, E.out2), cd = $('#cdotDisc');
    cd.setAttribute('r', (11 * (1 + 2 * burst)).toFixed(2)); cd.setAttribute('opacity', (1 - burst).toFixed(3));
    const mk = seg(t, 4.30, 4.46, E.out3), mw = $('#morphWord');
    css(mw, { opacity: mk.toFixed(3), filter: mk < 1 ? `blur(${(14 * (1 - mk)).toFixed(2)}px)` : 'none', transform: `translateY(${px(14 * (1 - mk))})` });
  }
  // bronze flood
  const fl = $('#flood');
  const flOn = t >= 4.95 && t < 5.36;
  show(fl, flOn);
  if (flOn) {
    const R = 1300 * seg(t, 4.95, 5.00, E.in2);
    const mask = t < 5.0 ? `radial-gradient(circle at 864px 551px, #000 ${px(Math.max(0, R - 30))}, transparent ${px(Math.max(R, 0.01))})` : 'none';
    fl.style.webkitMaskImage = fl.style.maskImage = mask;
    fl.style.opacity = (1 - seg(t, 5.30, 5.34)).toFixed(3);
    $('#floodSolid').style.opacity = (1 - seg(t, 4.99, 5.08)).toFixed(3);
  }
}

function drawBento(t) {
  const on = t >= 5.29 && t < 7.43;
  show($('#bento'), on);
  $('#bento').style.opacity = on ? '1' : '0';
  $('#bgCream').style.opacity = t >= 5.30 ? '1' : '0';
  show($('#bgCream'), t >= 5.29);
  if (!on) return;
  const c = cam(t), c0 = cam(t - 0.002), c1 = cam(t + 0.002), d = 0.004;
  const vx = Math.abs(c.s * (c1.fx - c0.fx) / d + 28 * (c1.ry - c0.ry) / d), vy = Math.abs(c.s * (c1.fy - c0.fy) / d + 28 * (c1.rx - c0.rx) / d);
  const zx = Math.abs(c1.s - c0.s) / d * 700;
  const bx = Math.min(6, 0.45 * (vx + zx) / SUBF), by = Math.min(6, 0.45 * (vy + 0.56 * zx) / SUBF);
  setBlur('mbCam', bx, by); $('#bento').style.filter = bx + by > 0.3 ? 'url(#mbCam)' : 'none';
  $('#bentoCam').style.transform = `translate(960px, 540px) scale(${c.s.toFixed(5)}) rotateZ(${c.rz.toFixed(4)}deg) rotateX(${c.rx.toFixed(4)}deg) rotateY(${c.ry.toFixed(4)}deg) translate(${px(-c.fx)}, ${px(-c.fy)})`;
  // flood → Springs card, in the grid plane
  const kf = seg(t, 5.30, 5.45, E.io3), fc = $('#floodCard');
  show(fc, t < 5.47);
  css(fc, { left: px(lerp(40, 700, kf)), top: px(lerp(-60, 185, kf)), width: px(lerp(1300, 520, kf)), height: px(lerp(820, 330, kf)),
    borderRadius: px(24 * kf), filter: kf < 1 ? `blur(${(30 * (1 - kf)).toFixed(2)}px)` : 'none', opacity: (1 - seg(t, 5.43, 5.47)).toFixed(3) });
  $('#floodCardSolid').style.opacity = kf.toFixed(3);
  $('#floodCardSolid').style.borderRadius = px(24 * kf);
  // tile fades (Data bars last)
  const order = { t1: 0, t2wrap: 1, t3: 2, t4: 3, t6: 4, t5: 5 };
  for (const id in order) $('#' + id).style.opacity = (1 - seg(t, 7.28 + 0.016 * order[id], 7.34 + 0.016 * order[id])).toFixed(3);
  // 01 kinetic type: weight 800 → 200 → 500
  const wgt = t < 6.25 ? lerp(800, 200, seg(t, 5.30, 6.25, E.sine)) : lerp(200, 500, seg(t, 6.25, 7.20, E.sine));
  $('#typePlain').style.fontWeight = $('#typePuffy').style.fontWeight = wgt.toFixed(1);
  $('#typePuffy').style.opacity = clamp((wgt - 500) / 250).toFixed(3);
  $('#typePlain').style.opacity = (1 - clamp((wgt - 500) / 250)).toFixed(3);
  // 02 springs: three dots on damped springs, 120 ms apart
  document.querySelectorAll('.sdot').forEach((d, j) => {
    const tau = t - (5.45 + 0.12 * j);
    const y = tau <= 0 ? -84 : -84 * Math.exp(-3.4 * tau) * Math.cos(2 * Math.PI * 1.75 * tau);
    d.style.top = px(196 + y);
  });
  // 03 cube
  $('#cube').style.transform = `rotateX(-28deg) rotateY(${lerp(35, 75, seg(t, 5.30, 7.28, E.sine)).toFixed(3)}deg)`;
  // 04 glass capsule sliding across the stripes
  $('#glassCap').style.left = px(150 + 100 * Math.sin(2 * Math.PI * (t - 5.30) / 1.5));
  // 05 data bars
  EL.bars.forEach((b, j) => { const k = seg(t, 5.78 + 0.04 * j, 6.10 + 0.04 * j, x => E.outBack(x, 1.9)); b.style.transform = `scaleY(${Math.max(0, k).toFixed(4)})`; });
  // 06 path drawing itself left to right
  const kp = seg(t, 5.92, 6.85, E.io2);
  EL.spath.style.strokeDashoffset = (EL.spLen * (1 - kp)).toFixed(2);
  const ph = $('#phead'), pt = EL.spath.getPointAtLength(EL.spLen * kp);
  ph.setAttribute('cx', pt.x.toFixed(2)); ph.setAttribute('cy', pt.y.toFixed(2)); ph.setAttribute('opacity', kp > 0 ? '1' : '0');
}

function drawCounter(t, tq) {
  const on = t >= 7.39 && t < 8.63;
  show($('#counterCam'), on);
  if (!on) return;
  const cc = $('#counterCam');
  const push = 1 + 0.03 * seg(t, 8.15, 8.50, E.sine), out = seg(t, 8.50, 8.62);
  css(cc, { opacity: (1 - out).toFixed(3), transform: push === 1 ? 'none' : `scale(${push.toFixed(5)})`, filter: out > 0 ? `blur(${(16 * out).toFixed(2)}px)` : 'none' });
  const kc = seg(t, 7.40, 7.55, E.out3);
  css($('#card'), { opacity: kc.toFixed(3), transform: `scale(${lerp(0.97, 1, kc).toFixed(4)})` });
  EL.strips.forEach((r, k) => {
    const c = reelPos(k, t), v = Math.abs(reelVel(k, t));
    r.s.style.transform = `translateY(${px(-300 * c)})`;
    r.reel.style.opacity = seg(t, 7.42, 7.52).toFixed(3);
    const sig = Math.min(14, 0.7 * v);
    r.blur.setAttribute('stdDeviation', `0 ${sig.toFixed(2)}`);
  });
  const kd = seg(t, 8.15, 8.27, x => E.outBack(x, 2.4));
  $('#cdot').style.transform = `scale(${Math.max(0, kd).toFixed(4)})`;
  const kfw = seg(t, 7.85, 8.00, E.out3);
  css($('#framesW'), { opacity: kfw.toFixed(3), transform: `translateX(${px(20 * (1 - kfw))})` });
  const txt = 'One HTML file.', n = Math.floor(txt.length * seg(tq, 7.95, 8.15) + 1e-6);
  $('#oneHtml').textContent = txt.slice(0, n);
}

function drawLogo(t) {
  $('#creamGlow').style.opacity = (seg(t, 8.50, 8.70) * (1 - seg(t, 9.10, 9.30))).toFixed(3);
  const sk = $('#spark'), ks = seg(t, 8.58, 8.66, E.out2);
  show(sk, t >= 8.58 && t < 8.67);
  css(sk, { transform: `translate(${px(lerp(672, 428, ks))}, 518px)`, opacity: (seg(t, 8.58, 8.595) * (1 - seg(t, 8.625, 8.66))).toFixed(3) });
  const settled = t >= 9.10;
  show($('#logoFinal'), settled);
  EL.wins.forEach((o, k) => {
    if (settled || t < 8.60) { show(o.w, false); return; }
    show(o.w, true);
    let dy = 0, dx = 0, op = 1, bx = 0, by = 0;
    if (k === 0) { const kp = seg(t, 8.60, 8.68, E.out3); op = kp; dx = -14 * (1 - kp); bx = 14 * (1 - kp); }
    else {
      const t0 = k <= 7 ? 8.66 + 0.035 * (k - 1) : 8.92, dur = k <= 7 ? 0.14 : 0.18;
      const u = clamp((t - t0) / dur), e = (k <= 7 ? RISE : RISE_A)(u);
      dy = o.h * (1 - e); by = 10 * (1 - clamp(u / 0.6)); op = t >= t0 ? 1 : 0;
    }
    o.w.style.opacity = op.toFixed(3);
    o.img.style.transform = dx || dy ? `translate(${px(dx)}, ${px(dy)})` : 'none';
    o.img.style.filter = bx > 0.01 || by > 0.01 ? `url(#mbW${k})` : 'none';
    o.blur.setAttribute('stdDeviation', `${bx.toFixed(2)} ${by.toFixed(2)}`);
  });
  $('#endVig').style.opacity = seg(t, 9.30, 9.95, E.io2).toFixed(4);
}
const RISE = spring(8 / 122, 4.6), RISE_A = spring(8 / 44, 4.6);

/* ============================================================================================
   Film grain: feTurbulence (baseFrequency .9), re-seeded every frame from mulberry32, rendered once
   per frame into a canvas (the sub-frames of a frame reuse it). Its mean follows the world colour so
   flat brand colours stay put; it never covers the logo rectangle.
   ============================================================================================ */
const gcv = $('#grain'), gctx = gcv.getContext('2d');
let grainKey = '';
async function grain(t) {
  const f = frameOf(t), tf = f / FPS, warm = seg(tf, 5.30, 5.45);
  const c = [lerp(79, 241, warm), lerp(71, 240, warm), lerp(64, 236, warm)].map(v => v / 255);
  const hole = tf >= 8.55, key = `${f}|${warm.toFixed(3)}|${hole}`;
  if (key === grainKey) return;
  grainKey = key;
  const seed = 1 + Math.floor(mulberry32(0x6A41 + f * 7919)() * 999983);
  const A = 2.0, mtx = c.map(v => `${A} 0 0 0 ${(v - A / 2).toFixed(4)}`).join('  ') + '  0 0 0 0 1';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${seed}"/><feColorMatrix type="matrix" values="${mtx}"/></filter><rect width="1920" height="1080" filter="url(#g)"/></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  if (grainKey !== key) return;
  gctx.globalCompositeOperation = 'copy';
  gctx.drawImage(img, 0, 0);
  if (hole) {
    gctx.globalCompositeOperation = 'destination-out';
    gctx.filter = 'blur(10px)';
    gctx.fillStyle = '#000';
    gctx.fillRect(LOGO.x - 24, LOGO.y - 24, LOGO.w + 48, LOGO.h + 48);
    gctx.filter = 'none';
  }
  gctx.globalCompositeOperation = 'source-over';
}

/* ============================================================================================
   Master timeline, seek, preview
   ============================================================================================ */
const clock = { t: 0 };
let drawnAt = -1;
const tl = gsap.timeline({ paused: true });
tl.to(clock, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: () => { draw(clock.t); drawnAt = clock.t; } });
function seek(t) {
  t = clamp(+t || 0, 0, DURATION);
  tl.seek(t, false);
  if (drawnAt !== t) { clock.t = t; draw(t); drawnAt = t; }
  return grain(t).then(() => t);
}

window.DURATION = DURATION;
window.__fps = FPS; window.__width = W; window.__height = H; window.__duration = DURATION; window.__timeline = tl;
window.__ready = (async () => {
  await Promise.all([
    document.fonts.load('800 100px Archivo'), document.fonts.load('100 100px Inter'), document.fonts.load('800 100px Inter'),
    document.fonts.load('400 17px "JetBrains Mono"'), document.fonts.load('600 17px "JetBrains Mono"'),
  ]);
  await document.fonts.ready;
  measure();
  G.REEL_X = 412;                           // reels start 42 px inside the card's left edge
  build();
  await Promise.all([...document.images].map(i => i.decode()));
  window.seek = seek;
  await seek(FREEZE ?? 0);
  if (!RENDER) {
    const st = $('#stage'), fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); st.style.transform = `scale(${k})`; };
    fit(); addEventListener('resize', fit);
    if (PLAY) { const t0 = performance.now(); const loop = now => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  }
  return true;
})();
})();
</script>
