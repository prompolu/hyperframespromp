<script>
(() => {
'use strict';
/* ============================================================================================
   PROMPOLU — "La qualité, notre meilleur profil." 9:16 website video. 1080×1920, 60 fps, 15.000 s.
   One paused GSAP master timeline drives draw(t); every state is a pure function of t.
   window.seek(t) renders time t exactly (and resolves once that frame's grain is drawn).
   ?render: renderer mode · ?play: real-time preview loop · ?t=4.55: freeze one moment.
   ============================================================================================ */
const W = 1080, H = 1920, FPS = 60, DURATION = 15;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render'), FREEZE = Q.has('t') ? +Q.get('t') : null, PLAY = Q.has('play') || (!RENDER && FREEZE === null);
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x, in2: x => x * x, out2: x => 1 - (1 - x) * (1 - x), io2: x => (x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2),
  in3: x => x ** 3, out3: x => 1 - (1 - x) ** 3, io3: x => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
  out4: x => 1 - (1 - x) ** 4, sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
};
const seg = (t, a, b, e = E.lin) => e(clamp((t - a) / (b - a)));
function spring(overshoot, settle = 5.2) {      // exact-overshoot spring ease: x(1) = 1, peak = 1 + overshoot
  const L = Math.log(overshoot), z = -L / Math.sqrt(Math.PI * Math.PI + L * L);
  const w = settle / z, wd = w * Math.sqrt(1 - z * z), c = z / Math.sqrt(1 - z * z);
  const x = u => 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + c * Math.sin(wd * u));
  const e1 = x(1);
  return u => (u <= 0 ? 0 : u >= 1 ? 1 : x(u) + (1 - e1) * u);
}
const SPR04 = spring(0.04, 4.6), SPR06 = spring(0.06, 4.6), SPR10 = spring(0.10, 4.6), SPR12 = spring(0.12, 4.2);
function mulberry32(a) {                          // seeded PRNG for dust, embers and grain (no Math.random)
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const frameOf = t => Math.floor(t * FPS + 1e-6);     // the 4 sub-frames t + k/240 share one frame
const frameT = t => frameOf(t) / FPS;
const SUBF = 240;                                     // sub-frame rate of the renderer (4 × 60)
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const px = v => v.toFixed(3) + 'px';
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const blurIn = (el, k, d = 10, dy = 18) => css(el, { opacity: k.toFixed(3), filter: k < 1 ? `blur(${(d * (1 - k)).toFixed(2)}px)` : 'none', transform: `translateY(${px(dy * (1 - k))})` });
const vel = (f, t, d = 0.002) => (f(t + d) - f(t - d)) / (2 * d);
const MB = {};
const setBlur = (id, sx, sy) => MB[id].setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);

/* ============================================================================================
   Layout
   ============================================================================================ */
const G = {};
const WC = { x: 540, y: 820 };                 // push-in origin (the opener block)
const CAP = 118, CAPC = 900, BASE = CAPC + CAP / 2;    // "PROFIL." cap height 118, cap centre y 900
const FR = { x: 540, y: 940, w: 860, h: 1100, r: 28, t: 22, ir: 12 };   // the window frame (aluminium profile)
const IN = { x: FR.x - FR.w / 2 + FR.t, y: FR.y - FR.h / 2 + FR.t, w: FR.w - 2 * FR.t, h: FR.h - 2 * FR.t };   // 132,372 816×1056
const LOGO = { x: 88, y: 838, w: 903, h: 124.5, s: 1.5 };
const WINS = [[0, 70], [70, 146], [146, 224], [224, 308], [308, 384], [384, 460], [460, 529], [529, 602]];
const RANGES = [
  ['Coulissants', 'Du S70P au S140RP Infinity'],
  ['Battants', 'S53RP+ · S46 · portes ALUDOORS'],
  ['Agencement', 'Cuisines & dressings sur-mesure'],
  ['Extérieur', 'Pergolas · garde-corps · bardage'],
];
const LAB_IN = [2.98, 4.47, 5.92, 7.30], LAB_OUT = [4.40, 5.86, 7.24, 9.40];
const PIN_F = { x: 330, y: 880, t0: 11.84 }, PIN_S = { x: 740, y: 1160, t0: 11.99 };

function measure() {
  const cv = document.createElement('canvas').getContext('2d');
  cv.font = '800 1000px Archivo'; cv.fontStretch = 'expanded';
  const capRatio = cv.measureText('H').actualBoundingBoxAscent / 1000;
  let FS = CAP / capRatio;
  const word = $('#word');
  const lay = fs => {
    const m = document.createElement('span');
    m.style.cssText = `position:absolute;left:0;top:0;white-space:pre;font-weight:800;font-family:Archivo;font-stretch:125%;font-size:${fs}px;line-height:1;letter-spacing:0.02em`;
    m.innerHTML = 'PROFIL.<i style="display:inline-block;width:0;height:0"></i>';
    word.appendChild(m);
    const box = m.getBoundingClientRect(), r = document.createRange(), tn = m.firstChild, xs = [], adv = [];
    for (let i = 0; i < 7; i++) { r.setStart(tn, i); r.setEnd(tn, i + 1); const b = r.getBoundingClientRect(); xs.push(b.left - box.left); adv.push(b.width); }
    const baseIn = m.querySelector('i').getBoundingClientRect().top - box.top;
    word.removeChild(m);
    cv.font = `800 ${fs}px Archivo`;
    const ink = [...'PROFIL.'].map(ch => cv.measureText(ch));
    return { xs, adv, baseIn, ink, L: xs[0] - ink[0].actualBoundingBoxLeft, R: xs[6] + ink[6].actualBoundingBoxRight };
  };
  let m = lay(FS);
  if (m.R - m.L > 960) { FS *= 960 / (m.R - m.L); m = lay(FS); }      // keep 60 px side margins
  const shift = 540 - (m.L + m.R) / 2;
  G.FS = FS; G.baseIn = m.baseIn; G.wordInk = [m.L + shift, m.R + shift]; G.capH = capRatio * FS;
  G.letters = [...'PROFIL.'].map((ch, i) => {
    const k = m.ink[i], x = m.xs[i] + shift;
    return { ch, x, adv: m.adv[i], top: BASE - m.baseIn, cx: x + (k.actualBoundingBoxRight - k.actualBoundingBoxLeft) / 2,
      cy: BASE - (k.actualBoundingBoxAscent - k.actualBoundingBoxDescent) / 2, w: k.actualBoundingBoxLeft + k.actualBoundingBoxRight, h: k.actualBoundingBoxAscent + k.actualBoundingBoxDescent };
  });
  // The O: ink box and counter (hole), scanned from a canvas rendering.

  idx.textContent = `0${cur + 1} / 04`;
  EL.labs.forEach(([n, s], i) => {
    const kin = seg(t, LAB_IN[i], LAB_IN[i] + 0.26, E.out3), kout = seg(t, LAB_OUT[i], LAB_OUT[i] + 0.15, E.in2);
    const vis = kin > 0 && kout < 1;
    show(n, vis); show(s, vis);
    if (!vis) return;
    const y = 24 * (1 - kin) - 30 * kout, op = kin * (1 - kout), bl = 10 * (1 - kin) + 8 * kout;
    css(n, { opacity: op.toFixed(3), transform: `translateY(${px(y)})`, filter: bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : 'none' });
    const ks = seg(t, LAB_IN[i] + 0.08, LAB_IN[i] + 0.34, E.out3), op2 = ks * (1 - kout);
    css(s, { opacity: op2.toFixed(3), transform: `translateY(${px(18 * (1 - ks) - 30 * kout)})` });
  });
}

function drawPage(t, tq) {
  // page scroll between sections, with vertical motion blur
  const sy = scrollY(t), v = Math.abs(vel(scrollY, t)), bs = Math.min(16, 0.45 * v / SUBF);
  $('#page').style.transform = sy ? `translateY(${px(sy)})` : 'none';
  setBlur('mbScroll', 0, bs);
  const out = seg(t, 12.85, 13.00);
  const pa = $('#pageAll');
  show(pa, t < 13.0);
  css(pa, { filter: out > 0 ? `blur(${(16 * out).toFixed(2)}px)` : bs > 0.3 ? 'url(#mbScroll)' : 'none', opacity: (1 - out).toFixed(3) });
  // section 3: "Pourquoi PROMPOLU" — +18 ans, distributeur officiel STRUGAL
  const s3 = t >= 8.98 && t < 11.82;
  show($('#sec3'), s3);
  if (s3) {
    EL.strips.forEach((r, k) => {
      r.s.style.transform = `translateY(${px(-300 * reelPos(k, t))})`;
      setBlur('mbR' + k, 0, Math.min(14, 0.7 * Math.abs(vel(u => reelPos(k, u), t))));
    });
    blurIn($('#ans'), seg(t, 10.00, 10.16, E.out3), 8, 22);
    blurIn($('#distrib'), seg(t, 10.26, 10.44, E.out3), 10, 14);
    $('#badge').style.transform = `scale(${lerp(0, 1, SPR12(clamp((t - 10.38) / 0.3))).toFixed(4)})`;
    const nt = 'EN 12207 · EN 12208 · EN 12210', n = Math.floor(nt.length * seg(tq, 10.55, 10.95) + 1e-6);
    $('#norms').textContent = nt.slice(0, n);
  }
  // section 4: Fès & Sefrou
  const s4 = t >= 11.38;
  show($('#sec4'), s4);
  if (s4) {
    for (const [P, id, mb] of [[PIN_F, '#pinF', 'mbPinF'], [PIN_S, '#pinS', 'mbPinS']]) {
      const y = pinY(P, t), el = $(id), vy = Math.abs(vel(u => pinY(P, u), t)), b = Math.min(16, 0.45 * vy / SUBF);
      css(el, { transform: `translate(${P.x}px, ${P.y}px)`, opacity: t >= P.t0 ? '1' : '0' });
      const pin = el.querySelector('.pin'), sh = el.querySelector('.pinShadow');
      setBlur(mb, 0, b);
      css(pin, { transform: `translateY(${px(y)})`, filter: b > 0.3 ? `url(#puffy) url(#${mb})` : 'url(#puffy)' });
      const hn = clamp(-y / 380);
      css(sh, { transform: `scale(${(1 - 0.6 * hn).toFixed(3)})`, opacity: (1 - 0.8 * hn).toFixed(3) });
    }
    const kr = seg(t, 12.05, 12.45, E.io2);
    EL.route.forEach((c, j) => c.setAttribute('opacity', (j + 1) / EL.route.length <= kr + 1e-6 ? '1' : '0'));
    const kf = seg(t, 12.00, 12.22, E.out3), ks = seg(t, 12.15, 12.37, E.out3);
    css($('#cityF'), { opacity: kf.toFixed(3), transform: `translateX(${px(-22 * (1 - kf))})` });
    css($('#cityS'), { opacity: ks.toFixed(3), transform: `translateX(${px(22 * (1 - ks))})` });
    blurIn($('#livraison'), seg(t, 12.45, 12.66, E.out3), 10, 16);
  }
}

function drawLogo(t) {
  $('#creamGlow').style.opacity = (seg(t, 12.90, 13.10) * (1 - seg(t, 13.50, 13.75))).toFixed(3);
  const sk = $('#spark'), ks = seg(t, 12.98, 13.06, E.out2);
  show(sk, t >= 12.98 && t < 13.07);
  css(sk, { transform: `translate(${px(lerp(378, LOGO.x + 52.5, ks))}, ${px(LOGO.y + 45.75)})`, opacity: (seg(t, 12.98, 12.995) * (1 - seg(t, 13.025, 13.06))).toFixed(3) });
  const settled = t >= 13.50;
  show($('#logoFinal'), settled);
  EL.wins.forEach(o => {
    const k = o.k;
    if (settled || t < 13.00) { show(o.w, false); return; }
    show(o.w, true);
    let dy = 0, dx = 0, op = 1, bx = 0, by = 0;
    if (k === 0) { const kp = seg(t, 13.00, 13.08, E.out3); op = kp; dx = -12 * (1 - kp); bx = 14 * (1 - kp); }
    else {
      const t0 = k <= 7 ? 13.06 + 0.035 * (k - 1) : 13.32, dur = k <= 7 ? 0.14 : 0.18;
      const u = clamp((t - t0) / dur), e = (k <= 7 ? RISE : RISE_A)(u);
      dy = o.h * (1 - e); by = 10 * (1 - clamp(u / 0.6)); op = t >= t0 ? 1 : 0;
    }
    o.w.style.opacity = op.toFixed(3);
    o.img.style.transform = dx || dy ? `translate(${px(dx)}, ${px(dy)})` : 'none';
    o.img.style.filter = bx > 0.01 || by > 0.01 ? `url(#mbW${k})` : 'none';
    setBlur('mbW' + k, bx, by);
  });
  blurIn($('#url'), seg(t, 13.60, 13.90, E.out3), 12, 14);
  $('#endVig').style.opacity = seg(t, 14.05, 14.85, E.io2).toFixed(4);
}
const RISE = spring(8 / 91.5, 4.6), RISE_A = spring(8 / 33, 4.6);

/* ============================================================================================
   Film grain: feTurbulence (baseFrequency .9) re-seeded every frame (mulberry32), drawn once per frame
   into a canvas shared by its 4 sub-frames; mean follows the world colour; never over the logo box.
   ============================================================================================ */
const gcv = $('#grain'), gctx = gcv.getContext('2d');
let grainKey = '';
async function grain(t) {
  const f = frameOf(t), tf = f / FPS, warm = seg(tf, 2.66, 3.00);
  const c = [lerp(79, 241, warm), lerp(71, 240, warm), lerp(64, 236, warm)].map(v => v / 255);
  const hole = tf >= 12.95, key = `${f}|${warm.toFixed(3)}|${hole}`;
  if (key === grainKey) return;
  grainKey = key;
  const seed = 1 + Math.floor(mulberry32(0x6A41 + f * 7919)() * 999983);
  const A = 2.0, mtx = c.map(v => `${A} 0 0 0 ${(v - A / 2).toFixed(4)}`).join('  ') + '  0 0 0 0 1';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${seed}"/><feColorMatrix type="matrix" values="${mtx}"/></filter><rect width="${W}" height="${H}" filter="url(#g)"/></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  if (grainKey !== key) return;
  gctx.globalCompositeOperation = 'copy'; gctx.drawImage(img, 0, 0);
  if (hole) { gctx.globalCompositeOperation = 'destination-out'; gctx.filter = 'blur(10px)'; gctx.fillStyle = '#000'; gctx.fillRect(LOGO.x - 24, LOGO.y - 24, LOGO.w + 48, LOGO.h + 48); gctx.filter = 'none'; }
  gctx.globalCompositeOperation = 'source-over';
}

/* ============================================================================================
   Master timeline, seek, preview
   ============================================================================================ */
const clock = { t: 0 };
let drawnAt = -1;
const tl = gsap.timeline({ paused: true });
tl.to(clock, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: () => { draw(clock.t); drawnAt = clock.t; } });
function seek(t) {
  t = clamp(+t || 0, 0, DURATION);
  tl.seek(t, false);
  if (drawnAt !== t) { clock.t = t; draw(t); drawnAt = t; }
  return grain(t).then(() => t);
}
window.DURATION = DURATION;
window.__fps = FPS; window.__width = W; window.__height = H; window.__duration = DURATION; window.__timeline = tl;
window.__ready = (async () => {
  await Promise.all([document.fonts.load('800 100px Archivo'), document.fonts.load('100 100px Inter'), document.fonts.load('800 100px Inter'),
    document.fonts.load('400 17px "JetBrains Mono"'), document.fonts.load('600 17px "JetBrains Mono"')]);
  await document.fonts.ready;
  measure();
  build();
  const urls = ['coulissants', 'battants', 'agencement', 'exterieur'].map(n => `assets/photos/${n}.webp`);
  await Promise.all([...document.images].map(i => i.decode()).concat(urls.map(u => { const i = new Image(); i.src = u; return i.decode(); })));
  window.seek = seek;
  await seek(FREEZE ?? 0);
  if (!RENDER) {
    const st = $('#stage'), fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); st.style.transform = `scale(${k})`; };
    fit(); addEventListener('resize', fit);
    if (PLAY) { const t0 = performance.now(); const loop = now => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  }
  return true;
})();
})();
</script>
